[workspace]
members = ["core", "fuzz", "macros"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sharp0802/bitx"

[workspace.dependencies]
bitx = { path = "core", version = "0.2" }
bitx-macros = { path = "macros", version = "0.2" }
libfuzzer-sys = "0.4"
proc-macro2 = "1.0"
proptest = "1.11"
quote = "1.0"
trybuild = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unused_results = "deny"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
min_ident_chars = "warn"
must_use_candidate = "warn"

